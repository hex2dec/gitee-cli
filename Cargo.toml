[package]
name = "gitee-cli"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Agent-first CLI for gitee.com workflows"
readme = "README.md"
repository = "https://github.com/hex2dec/gitee-cli"
homepage = "https://github.com/hex2dec/gitee-cli"
rust-version = "1.94.0"
keywords = ["gitee", "cli", "git", "automation"]
categories = ["command-line-utilities"]

[workspace]
members = ["crates/gitee-api-v5"]

[workspace.package]
version = "0.4.0"

[[bin]]
name = "gitee"
path = "src/main.rs"

[dependencies]
clap = "4.5.37"
gitee-api-v5 = { path = "crates/gitee-api-v5" }
include_dir = "0.7.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.23"

[dev-dependencies]
assert_cmd = "2.0.16"
httpmock = "0.7.0"
predicates = "3.1.3"
serde_json = "1.0.140"
tempfile = "3.20.0"
