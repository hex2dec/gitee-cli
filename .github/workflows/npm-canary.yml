name: NPM Canary

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            npm_platform: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            npm_platform: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Rust version
        id: rust-version
        run: echo "version=$(awk '/^rust / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ steps.rust-version.outputs.version }}" --profile minimal
          rustup default "${{ steps.rust-version.outputs.version }}"
          rustup target add "${{ matrix.target }}"

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Compute canary version
        id: canary-version
        run: |
          base_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          version="${base_version}-commit.${short_sha}.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Apply canary version
        run: |
          node scripts/set-root-cargo-version.mjs "${{ steps.canary-version.outputs.version }}"
          cargo update -p gitee-cli --precise "${{ steps.canary-version.outputs.version }}"

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package npm platform package
        run: |
          node scripts/prepare-npm-packages.mjs platform \
            --platform "${{ matrix.npm_platform }}" \
            --version "${{ steps.canary-version.outputs.version }}" \
            --binary "target/${{ matrix.target }}/release/gitee" \
            --out dist/npm
          tar -C dist/npm -czf "dist/npm-${{ matrix.npm_platform }}.tar.gz" "gitee-cli-${{ matrix.npm_platform }}"

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm_platform }}
          path: dist/npm-${{ matrix.npm_platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Compute canary version
        id: canary-version
        run: |
          base_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          version="${base_version}-commit.${short_sha}.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Download npm platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-package-archives
          merge-multiple: true

      - name: Prepare npm packages
        run: |
          mkdir -p npm-packages
          for archive in npm-package-archives/*.tar.gz; do
            tar -xzf "$archive" -C npm-packages
          done
          node scripts/prepare-npm-packages.mjs main \
            --version "${{ steps.canary-version.outputs.version }}" \
            --out npm-packages

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY_VERSION: ${{ steps.canary-version.outputs.version }}
          COMMIT_TAG: commit-${{ steps.canary-version.outputs.short_sha }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is required to publish npm packages"
            exit 1
          fi

          npm publish npm-packages/gitee-cli-darwin-arm64 --access public --provenance --tag canary
          npm publish npm-packages/gitee-cli-linux-x64 --access public --provenance --tag canary
          npm publish npm-packages/gitee-cli --access public --provenance --tag canary

          npm dist-tag add "@pkg-in/gitee-cli-darwin-arm64@${CANARY_VERSION}" "${COMMIT_TAG}"
          npm dist-tag add "@pkg-in/gitee-cli-linux-x64@${CANARY_VERSION}" "${COMMIT_TAG}"
          npm dist-tag add "@pkg-in/gitee-cli@${CANARY_VERSION}" "${COMMIT_TAG}"
